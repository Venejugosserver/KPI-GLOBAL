  function actualizarLogoMarca(marca) {
    const el = $("logoMarca");
    const b64 = LOGOS_MARCA[marca];
    if (b64) { el.src = "data:image/png;base64," + b64; el.alt = marca; el.style.display = "inline-block"; }
    else { el.removeAttribute("src"); el.alt = ""; el.style.display = "none"; }
  }
  let DS = DATASET_BASE, CFG = {};

  const sem = v => v == null ? "gris" : v >= 100 ? "ok" : v >= 70 ? "med" : "mal";
  const color = v => v == null ? "#98A2C0" : v >= 100 ? "#128C5A" : v >= 70 ? "#E08A00" : "#E5142B";
  const inverso = () => $("fMedida").value === "inv";
  const val = o => inverso() ? (o.pendienteAct != null ? o.pendienteAct : o.pendiente) : (o.pctAct != null ? o.pctAct : o.pct);
  const opt = () => ({ marca: $("fMarca").value, vendedor: $("fVend").value, medida: $("fVol").value });
  const nomMarca = m => m === "TODAS" ? "todas las marcas" : m;
  const avisoCuota = txt => `<div class="tarjeta c12"><div class="vacio">${txt}</div></div>`;

  function dona(pct, tam, col){
    const p = Math.max(0, Math.min(100, pct || 0)), R = (tam/2) - 6, C = 2 * Math.PI * R, c = col || "#1740C4";
    return `<svg class="dona" width="${tam}" height="${tam}" viewBox="0 0 ${tam} ${tam}">
      <circle cx="${tam/2}" cy="${tam/2}" r="${R}" fill="none" stroke="#E8EDFB" stroke-width="9"></circle>
      <circle cx="${tam/2}" cy="${tam/2}" r="${R}" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round"
        stroke-dasharray="${(C*p/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${tam/2} ${tam/2})"></circle>
      <text x="50%" y="50%" text-anchor="middle" dy=".35em" font-size="${tam*0.23}" fill="${c}">${pct == null ? "—" : Math.round(pct) + "%"}</text>
    </svg>`;
  }

  function tarjetaSup(S, md){
    const total = S.equipo.reduce((a,v)=>a+v.cartera,0) || 1;
    const cintas = S.equipo.map(v => `<span style="width:${100*v.cartera/total}%;background:${color(v.pct)}"></span>`).join("");
    return `<div class="tarjeta c6">
      <div class="sup-cab">
        ${dona(val(S), 74, color(S.pct))}
        <div>
          <p class="nom">${S.supervisor}</p>
          <p class="cifra">${f0(S.meta)} / ${f0(S.activados)}<small>meta / activados · cartera ${f0(S.cartera)} · activación ${fp(S.pctAct)} · ${f1(S.porDia)} clientes/día · ${md.fmt(S.vol)}</small></p>
        </div>
      </div>
      <div class="cintas">${cintas}</div>
      <ul class="equipo">
        ${S.equipo.map(v => `<li class="${v.pct != null && v.pct < 70 ? "bajo" : ""}">
          <span class="punto" style="background:${color(v.pct)}"></span>
          <span class="quien">${v.vendedor}${v.enEstructura ? "" : '<span class="etq azul">sin cartera asignada</span>'}</span>
          <span class="par"><b>${f0(v.meta)}</b> / <b>${f0(v.activados)}</b> · falta <b>${f0(v.faltan)}</b></span>
          <span class="tanto t-${sem(v.pct)}">${val(v) == null ? "—" : fp(val(v))}</span>
        </li>`).join("")}
      </ul>
    </div>`;
  }

  function tablaVend(M){
    const v = M.vendedores.slice().sort((a,b)=> (b.pct||0)-(a.pct||0)), md = M.medida, uVol = md.u === "kg" ? "Kg" : md.u === "und" ? "Unidades" : "Venta US$";
    const falt = x => Math.max(0, x.cartera - x.activados);
    return `<div class="tarjeta c12">
      <h3>Detalle por vendedor</h3>
      <p class="sub">${nomMarca(M.marca)} · target ${M.target}% sobre la cartera asignada de cada vendedor · activaciones por día calculadas sobre ${M.dias.restantes} días hábiles restantes</p>
      <div class="tw"><table>
        <thead><tr><th>Vendedor</th><th>Supervisor</th><th>Base</th><th>Activados</th><th>Faltante</th><th>% Act.</th><th>Target</th><th>Cumplimiento</th><th>${uVol}</th><th>Meta</th><th>Por activar a la meta</th><th>Activaciones por día</th><th>Clientes atendidos</th></tr></thead>
        <tbody>${v.map(x=>`<tr>
          <td><b>${x.vendedor}</b></td><td>${x.supervisor}</td>
          <td>${f0(x.cartera)}${x.enEstructura ? "" : " *"}</td><td>${f0(x.activados)}</td><td>${f0(falt(x))}</td>
          <td>${x.pctAct == null ? "—" : fp(x.pctAct)}</td><td>${M.target}%</td>
          <td><span class="pill ${sem(x.pct)}">${x.pct == null ? "—" : fp(x.pct)}</span></td>
          <td>${md.fmt(x.vol)}</td><td>${f0(x.meta)}</td>
          <td>${x.faltan === 0 ? "cubierto" : f0(x.faltan)}</td><td>${x.faltan === 0 ? "—" : f1(x.porDia)}</td><td>${f0(x.atendida)}</td></tr>`).join("")}</tbody>
        <tfoot><tr><td>Total</td><td>—</td><td>${f0(M.total.cartera)}</td><td>${f0(M.total.activados)}</td><td>${f0(Math.max(0, M.total.cartera - M.total.activados))}</td>
        <td>${fp(M.total.pctAct)}</td><td>${M.target}%</td><td><span class="pill ${sem(M.total.pct)}">${fp(M.total.pct)}</span></td>
        <td>${md.fmt(M.total.vol)}</td><td>${f0(M.total.meta)}</td><td>${f0(M.total.faltan)}</td><td>${f1(M.total.porDia)}</td><td>—</td></tr></tfoot>
      </table></div>
      <p class="notas" style="margin-top:8px">Faltante = base − activados. Cumplimiento = activados ÷ meta (base × target).${v.some(x => !x.enEstructura) ? " * Vendedor sin cartera asignada en la estructura comercial: se usa como base la cantidad de clientes que atendió. Asígnela en el panel administrativo." : ""}</p>
    </div>`;
  }

  function alertas(M){
    const flojos = M.vendedores.filter(v => v.pct != null && v.pct < 70).sort((a,b)=> b.faltan - a.faltan);
    const marcas = M.porMarca.filter(c => c.faltan > 0).sort((a,b)=> (b.foco - a.foco) || (b.faltan - a.faltan));
    const lista = (arr, vacio, fila) => arr.length ? `<ul class="equipo">${arr.slice(0,8).map(fila).join("")}</ul>` : `<p class="notas" style="margin-top:6px">${vacio}</p>`;
    return `
    <div class="tarjeta c6" style="border-left:5px solid var(--rojo)">
      <h3>Alerta de vendedores</h3>
      <p class="sub">${flojos.length} de ${M.vendedores.length} vendedores por debajo de 70% del target en ${M.marca === "TODAS" ? "activación general" : M.marca}</p>
      ${lista(flojos, "Ningún vendedor por debajo del umbral en esta marca.", v => `<li class="bajo">
        <span class="punto" style="background:${color(v.pct)}"></span>
        <span class="quien">${v.vendedor}<br><span style="font-weight:500;color:var(--gris);font-size:.74rem">${v.supervisor}</span></span>
        <span class="par">faltan <b>${f0(v.faltan)}</b> · <b>${f1(v.porDia)}</b>/día</span>
        <span class="tanto t-${sem(v.pct)}">${fp(v.pctAct)}</span></li>`)}
    </div>
    <div class="tarjeta c6" style="border-left:5px solid var(--ambar)">
      <h3>Alerta de activación por marca</h3>
      <p class="sub">Marcas por debajo del target${M.vendedor === "TODOS" ? "" : " para " + M.vendedor}, primero las foco · corte ${M.dias.corte} · ${M.dias.transcurridos} de ${M.dias.habiles} días hábiles</p>
      ${lista(marcas, "Todas las marcas alcanzan su target.", c => `<li class="${c.pct < 70 ? "bajo" : ""}">
        <span class="punto" style="background:${color(c.pct)}"></span>
        <span class="quien">${c.marca}${c.foco ? '<span class="etq">foco</span>' : ""}<br><span style="font-weight:500;color:var(--gris);font-size:.74rem">target ${c.target}% · activación ${fp(c.pctCartera)}</span></span>
        <span class="par">faltan <b>${f0(c.faltan)}</b> · <b>${f1(c.porDia)}</b>/día</span>
        <span class="tanto t-${sem(c.pct)}">${fp(c.pct)}</span></li>`)}
    </div>`;
  }

  function tablaMarcas(M){
    const md = M.medida, uVol = md.u === "kg" ? "Kg" : md.u === "und" ? "Unidades" : "Venta US$";
    return `<div class="tarjeta c12">
      <h3>Activación por marca${M.vendedor === "TODOS" ? "" : " · " + M.vendedor}</h3>
      <p class="sub">Base: <b>${f0(M.bases.alcance)}</b> clientes en las carteras ${M.vendedor === "TODOS" ? "del equipo" : "del vendedor"} · maestro general ${f0(M.bases.universo)} · las activaciones por día indican cuántos clientes deben activarse por día hábil para llegar a la meta</p>
      <div class="tw"><table>
        <thead><tr><th>Marca</th><th>Base</th><th>Activados</th><th>Faltante</th><th>% Act.</th><th>Target</th><th>${inverso() ? "Brecha pendiente" : "Cumplimiento"}</th><th>${uVol}</th><th>Meta</th><th>Por activar a la meta</th><th>Activaciones por día</th></tr></thead>
        <tbody>${M.porMarca.map(c=>`<tr class="${c.foco ? "foco" : ""}">
          <td><b>${c.marca}</b>${c.foco ? '<span class="etq">foco</span>' : ""}</td>
          <td>${f0(c.cartera)}</td><td>${f0(c.activados)}</td><td>${f0(Math.max(0, c.cartera - c.activados))}</td>
          <td>${fp(c.pctCartera)}</td><td>${c.target}%</td>
          <td><span class="pill ${sem(c.pct)}">${c.pct == null ? "—" : fp(inverso() ? c.pendiente : c.pct)}</span></td>
          <td>${md.fmt(c.vol)}</td><td>${f0(c.meta)}</td>
          <td>${c.faltan === 0 ? "cubierto" : f0(c.faltan)}</td><td>${c.faltan === 0 ? "—" : f1(c.porDia)}</td></tr>`).join("")}</tbody>
      </table></div>
      <p class="notas" style="margin-top:8px">Base: ${M.vendedor === "TODOS" ? "maestro de cada marca; si no está cargado, la suma de sus carteras o la cartera del equipo" : "cartera del vendedor en cada marca"}. Faltante = base − activados. Cumplimiento = activados ÷ meta (base × target).</p>
    </div>`;
  }

  /* ---------- clientes ---------- */
  let FILTRO_TXT = "", SOLO_ACT = true;
  function tablaClientes(){
    const C = VJ.clientesDe(DS, CFG, opt());
    const txt = FILTRO_TXT.toLowerCase();
    const filas = C.lista.filter(c => SOLO_ACT ? c.activado : true)
      .filter(c => !txt || (c.nombre + " " + c.codigo + " " + c.ruc + " " + c.vendedor).toLowerCase().includes(txt));
    const totalUs = filas.reduce((a,c)=>a+c.monto,0);
    return `<div class="tarjeta c12">
      <h3>Clientes activados · ${nomMarca(C.marca)}${C.vendedor === "TODOS" ? "" : " · " + C.vendedor}</h3>
      <p class="sub">Activado = cliente con monto mayor a cero en la marca. ${f0(C.activados)} activados de ${f0(C.atendidos)} clientes con movimiento. La columna Marcas cuenta cuántas marcas distintas compró el cliente en el mes.</p>
      <div class="buscador no-print">
        <input id="qCli" type="text" placeholder="Buscar por cliente, RIF, código o vendedor" value="${FILTRO_TXT.replace(/"/g,"&quot;")}">
        <label style="font-size:.82rem;display:flex;align-items:center;gap:6px"><input type="checkbox" id="qAct" ${SOLO_ACT ? "checked" : ""}> Solo activados</label>
        <button class="btn azul" id="bCsv">Descargar CSV de esta vista</button>
        <button class="btn linea" id="bCsvTodo">Descargar CSV por marca</button>
        <span style="font-size:.78rem;color:var(--gris)">${f0(filas.length)} filas · ${fu(totalUs)}</span>
      </div>
      <div class="tw" style="max-height:620px;overflow:auto"><table>
        <thead><tr><th>Cliente</th><th>RIF</th><th>Código</th><th>Vendedor</th><th>Supervisor</th><th>Monto</th><th>Kilos</th><th>Marcas</th><th>Facturas</th><th>Última compra</th><th>Estado</th></tr></thead>
        <tbody>${filas.slice(0,400).map(c=>`<tr>
          <td><b>${c.nombre}</b></td><td>${c.ruc || "—"}</td><td>${c.codigo}</td><td>${c.vendedor}</td><td>${c.supervisor}</td>
          <td>${fu(c.monto)}</td><td>${f1(c.kilos)}</td><td>${f0(c.nMarcas)}</td><td>${f0(c.facturas)}</td><td>${c.ultima}</td>
          <td><span class="pill ${c.activado ? "ok" : "mal"}">${c.activado ? "activado" : "sin compra"}</span></td></tr>`).join("")}</tbody>
      </table></div>
      ${filas.length > 400 ? `<p class="notas" style="margin-top:8px">Se muestran las primeras 400 filas de ${f0(filas.length)}; el CSV las trae todas.</p>` : ""}
    </div>`;
  }

  function csv(filas, cab){
    const esc = v => '"' + String(v == null ? "" : v).replace(/"/g,'""') + '"';
    return "\ufeff" + [cab.join(";")].concat(filas.map(f => f.map(esc).join(";"))).join("\r\n");
  }
  function bajar(nombre, texto){
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([texto], { type: "text/csv;charset=utf-8" }));
    a.download = nombre; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  }
  const n2 = v => v.toFixed(2).replace(".", ",");
  function csvVista(){
    const C = VJ.clientesDe(DS, CFG, opt());
    const filas = C.lista.filter(c => SOLO_ACT ? c.activado : true).map(c =>
      [c.ruc, c.codigo, c.nombre, c.vendedor, c.supervisor, c.zona, C.marca, n2(c.monto), n2(c.kilos), c.nMarcas, c.facturas, c.ultima, c.activado ? "ACTIVADO" : "SIN COMPRA"]);
    bajar(`clientes_activados_${C.marca}_${C.vendedor}.csv`.replace(/\s+/g,"_"),
      csv(filas, ["RIF","Codigo","Cliente","Vendedor","Supervisor","Zona","Marca","Monto","Kilos","Marcas compradas","Facturas","Ultima compra","Estado"]));
  }
  function csvTodo(){
    const filas = [];
    VJ.ranking(DS).forEach(marca => {
      const C = VJ.clientesDe(DS, CFG, { marca, vendedor: $("fVend").value });
      C.lista.filter(c => c.activado).forEach(c => filas.push([marca, c.ruc, c.codigo, c.nombre, c.vendedor, c.supervisor, c.zona, n2(c.monto), n2(c.kilos), c.facturas, c.ultima]));
    });
    bajar("clientes_activados_por_marca.csv", csv(filas, ["Marca","RIF","Codigo","Cliente","Vendedor","Supervisor","Zona","Monto","Kilos","Facturas","Ultima compra"]));
  }
  function pintarClientes(){
    $("clientes").innerHTML = tablaClientes();
    $("qCli").addEventListener("input", e => { FILTRO_TXT = e.target.value; const pos = e.target.selectionStart; pintarClientes(); const n = $("qCli"); n.focus(); n.setSelectionRange(pos, pos); });
    $("qAct").addEventListener("change", e => { SOLO_ACT = e.target.checked; pintarClientes(); });
    $("bCsv").addEventListener("click", csvVista);
    $("bCsvTodo").addEventListener("click", csvTodo);
  }

  /* ---------- rolling ---------- */
  function tablaRolling(){
    const R = VJ.rolling(DS, CFG, { medida: $("fVol").value }), md = R.medida;
    const celdas = v => `
      <td>${v.cuota ? md.fmt(v.cuota) : "—"}</td><td>${md.fmt(v.ventaDia)}</td><td>${md.fmt(v.venta)}</td>
      <td><span class="pill ${sem(v.cumpl)}">${v.cumpl == null ? "—" : fp(v.cumpl)}</span></td>
      <td>${v.cuota ? md.fmt(v.necesidad) : "—"}</td><td>${md.fmt(v.proyeccion)}</td>
      <td><span class="pill ${sem(v.cumplProy)}">${v.cumplProy == null ? "—" : fp(v.cumplProy)}</span></td>`;
    const cab = primera => `<thead><tr><th>${primera}</th><th>Cuota del mes</th><th>Venta día ${R.dias.corte.slice(0,5)}</th><th>Venta mes</th><th>% cumpl.</th><th>Necesidad diaria</th><th>Proyección</th><th>% cump. proyect.</th></tr></thead>`;
    const filasV = R.supervisores.map(S => `${S.equipo.map(v => `<tr><td>${v.vendedor}</td>${celdas(v)}</tr>`).join("")}
      <tr class="grupo"><td>${S.supervisor}</td>${celdas(S)}</tr>`).join("");
    const filasM = R.marcas.map(m => `<tr class="${m.foco ? "foco" : ""}"><td>${m.marca}${m.foco ? '<span class="etq">foco</span>' : ""}</td>${celdas(m)}</tr>`).join("");
    const tot = R.sinCuotaVend ? R.totalMarcas : R.total;
    return `
    <div class="tarjeta kpi c3"><p class="rot">Tiempo transcurrido</p><p class="val">${fp(R.dias.tt)}</p>
      <div class="barrita"><span class="med" style="width:${R.dias.tt}%"></span></div>
      <p class="pie">${R.dias.transcurridos} de ${R.dias.habiles} días hábiles al ${R.dias.corte}<br><b>${R.dias.restantes}</b> días por facturar</p></div>
    <div class="tarjeta kpi rojo c3"><p class="rot">Volumen del mes vs cuota</p><p class="val">${md.fmt(R.totalMarcas.venta)}</p>
      <div class="barrita"><span class="${sem(tot.cumpl)}" style="width:${Math.min(100, tot.cumpl||0)}%"></span></div>
      <p class="pie">${tot.cuota ? `Cuota <b>${md.fmt(tot.cuota)}</b> · cumplimiento <b>${fp(tot.cumpl)}</b><br>Faltan <b>${md.fmt(tot.falta)}</b>` : "Sin cuotas cargadas<br>Defínalas en el panel administrativo"}</p></div>
    <div class="tarjeta kpi ambar c3"><p class="rot">Necesidad diaria</p><p class="val">${tot.cuota ? md.fmt(tot.necesidad) : "—"}</p>
      <p class="pie">Para cerrar la cuota en los ${R.dias.restantes} días hábiles restantes<br>Venta del día ${R.dias.corte}: <b>${md.fmt(R.totalMarcas.ventaDia)}</b></p></div>
    <div class="tarjeta kpi verde c3"><p class="rot">Proyección al cierre</p><p class="val">${md.fmt(R.totalMarcas.proyeccion)}</p>
      <div class="barrita"><span class="${sem(tot.cumplProy)}" style="width:${Math.min(100, tot.cumplProy||0)}%"></span></div>
      <p class="pie">Cumplimiento proyectado <b>${fp(tot.cumplProy)}</b><br>Al ritmo del ${fp(R.dias.tt)} de tiempo transcurrido</p></div>

    <div class="tarjeta c12">
      <h3>Rolling por marca</h3>
      <p class="sub">Corte ${R.dias.corte} · la proyección divide el volumen del mes entre el ${fp(R.dias.tt)} de tiempo transcurrido; la necesidad diaria reparte lo que falta entre los ${R.dias.restantes} días hábiles que quedan</p>
      ${R.sinCuotaMarca ? `<div class="vacio" style="margin-bottom:12px">No hay cuotas por marca en ${md.nombre}. Cárguelas en el panel administrativo para ver cumplimiento y necesidad diaria.</div>` : ""}
      <div class="tw"><table>${cab("Marca")}<tbody>${filasM}</tbody>
        <tfoot><tr class="granTotal"><td>TOTAL PORTAFOLIO</td>${celdas(R.totalMarcas)}</tr></tfoot></table></div>
    </div>

    <div class="tarjeta c12">
      <h3>Rolling por asesor</h3>
      <p class="sub">Todo el portafolio por vendedor y supervisor · cuota en ${md.nombre} asignada en el panel administrativo</p>
      ${R.sinCuotaVend ? `<div class="vacio" style="margin-bottom:12px">No hay cuotas por asesor en ${md.nombre}. Cárguelas en la estructura comercial del panel administrativo.</div>` : ""}
      <div class="tw"><table>${cab("Vendedor")}<tbody>${filasV}</tbody>
        <tfoot><tr class="granTotal"><td>TOTAL VENEJUGOS</td>${celdas(R.total)}</tr></tfoot></table></div>
      <div class="buscador no-print" style="margin-top:12px;margin-bottom:0">
        <button class="btn azul" id="bCsvRoll">Descargar CSV del rolling</button>
      </div>
    </div>`;
  }
  function csvRolling(){
    const R = VJ.rolling(DS, CFG, { medida: $("fVol").value });
    const n = v => v == null ? "" : v.toFixed(2).replace(".", ",");
    const fila = (nivel, a, b, v) => [nivel, a, b, n(v.cuota), n(v.ventaDia), n(v.venta), n(v.cumpl), n(v.necesidad), n(v.proyeccion), n(v.cumplProy)];
    const filas = [];
    R.marcas.forEach(m => filas.push(fila("MARCA", m.marca, m.foco ? "FOCO" : "", m)));
    filas.push(fila("TOTAL", "PORTAFOLIO", "", R.totalMarcas));
    R.supervisores.forEach(S => { S.equipo.forEach(v => filas.push(fila("ASESOR", v.supervisor, v.vendedor, v))); filas.push(fila("SUPERVISOR", S.supervisor, "", S)); });
    filas.push(fila("TOTAL", "VENEJUGOS", "", R.total));
    bajar(`rolling_global_kpi_${R.medida.u}_${R.dias.corte.replace(/\//g,"-")}.csv`.replace("US$","usd"),
      csv(filas, ["Nivel","Marca o supervisor","Vendedor o foco","Cuota","Venta del dia","Venta mes","% cumpl","Necesidad diaria","Proyeccion","% cump proyect"]));
  }
  function pintarRolling(){ $("rolling").innerHTML = tablaRolling(); $("bCsvRoll").addEventListener("click", csvRolling); }

  /* ---------- semanal ---------- */
  let DIA_SEM = "";      /* día de cierre elegido en la pestaña semanal ("" = corte vigente) */
  function calendario(W, cuotaEq, md){
    const tot = W.semanas.reduce((a,s)=>a+s.dias,0) || 1;
    return `<div style="display:flex;gap:6px;margin:6px 0 4px">${W.semanas.map((s,k) => {
      const est = k < W.semActual ? "cerrada" : k === W.semActual ? "en curso" : "por venir";
      const bg = est === "cerrada" ? "var(--azul)" : est === "en curso" ? "var(--rojo)" : "var(--azul-claro)";
      const fg = est === "por venir" ? "var(--azul)" : "#fff";
      return `<div style="flex:${s.dias} 1 0;min-width:74px;background:${bg};color:${fg};border-radius:10px;padding:8px 10px">
        <div style="font-weight:800;font-size:.86rem">S${s.n} · ${s.desde}–${s.hasta}</div>
        <div style="font-size:.72rem;opacity:.9">${s.dias} día${s.dias===1?"":"s"} hábil${s.dias===1?"":"es"}${s.feriados ? " · " + s.feriados + " feriado" : ""} · ${fp(100*s.dias/tot)}</div>
        ${cuotaEq ? `<div style="font-size:.72rem;opacity:.9">meta ${md.fmt(cuotaEq*s.dias/tot)}</div>` : ""}
        <div style="font-size:.68rem;font-weight:800;margin-top:2px">${est}${est === "en curso" ? " · " + W.habEnCurso + " de " + s.dias + " días" : ""}</div></div>`;
    }).join("")}</div>`;
  }

  function tablaSemanal(){
    const W = VJ.semanal(DS, CFG, Object.assign(opt(), { hasta: DIA_SEM || undefined })), md = W.medida;
    const cuotaEq = W.totales.cuota;
    const cab = W.semanas.map((s,k) => `<th>S${s.n}<br><small style="font-weight:600">${s.desde}–${s.hasta} · ${s.dias}d · ${fp(100*s.dias/W.habiles)}</small></th>`).join("");
    const celda = (sm, real, meta, metaSem, deficit, fmt, activa) => {
      if (!activa) return `<td class="sem fuera">—</td>`;
      if (sm.estado === "por venir") return `<td class="sem fuera"><small>meta acum.</small>${fmt(meta)}</td>`;
      return `<td class="sem"><span class="pill ${deficit > 0 ? "mal" : "ok"}">${deficit > 0 ? "−" + fmt(deficit) : "al día"}</span><small>${fmt(real)} de ${fmt(meta)}${sm.estado === "en curso" ? " · en curso" : ""}</small></td>`;
    };
    const bloque = (titulo, sub, kReal, kMeta, kMetaSem, kDef, kInc, kFalta, fmt, total, activa) => `
      <div class="tarjeta c12"><h3>${titulo}</h3><p class="sub">${sub}</p>
        <div class="tw"><table>
          <thead><tr><th>Vendedor</th><th>Supervisor</th><th>Meta del mes</th>${cab}<th>Déficit al ${W.corte.slice(0,5)}</th><th>Para cerrar la semana ${W.semActual+1}</th></tr></thead>
          <tbody>${W.filas.filter(activa).map(v => `<tr><td><b>${v.vendedor}</b></td><td>${v.supervisor}</td>
            <td>${fmt(kReal === "volAcum" ? v.cuota : v.metaCli)}</td>
            ${v.semanas.map(sm => celda(sm, sm[kReal], sm[kMeta], sm[kMetaSem], sm[kDef], fmt, true)).join("")}
            <td><span class="pill ${v[kInc] ? "mal" : "ok"}">${v[kInc] ? fmt(v[kDef]) : "al día"}</span></td>
            <td>${v[kFalta] > 0 ? `${fmt(v[kFalta])}<small style="display:block;color:var(--gris);font-size:.68rem">${v.diasRestSem ? "en " + v.diasRestSem + " día" + (v.diasRestSem===1?"":"s") + " · " + fmt(v[kFalta]/v.diasRestSem) + "/día" : "último día de la semana"}</small>` : "cubierta"}</td></tr>`).join("")}</tbody>
          <tfoot><tr><td>Total</td><td>—</td><td>${fmt(kReal === "volAcum" ? W.totales.cuota : W.totales.metaCli)}</td>${W.semanas.map(() => "<td>—</td>").join("")}<td>${fmt(total)}</td><td>—</td></tr></tfoot>
        </table></div></div>`;

    const enDef = W.enDeficit;
    const dias = DS.dias.slice().reverse();
    const selector = `<div class="buscador no-print" style="margin:0 0 10px">
        <label for="fDiaSem" style="font-size:.78rem;font-weight:700;color:var(--gris)">Ver el déficit al cierre del día</label>
        <select id="fDiaSem"><option value="">Corte vigente (${W.corte})</option>${dias.map(d => `<option value="${d}" ${d === DIA_SEM ? "selected" : ""}>${d}</option>`).join("")}</select>
        <span style="font-size:.76rem;color:var(--gris)">Solo cuenta lo facturado hasta ese día. Los cierres ya registrados están en la pestaña Histórico.</span></div>`;

    const logica = `<div class="tarjeta c12">
      <h3>Calendario de metas de ${DS.mes}</h3>
      <p class="sub">${W.habiles} días hábiles${W.feriados.length ? " (sin feriados: " + W.feriados.filter(f => f.slice(3) === DS.mes).join(", ") + ")" : ""} en ${W.total} semanas de lunes a viernes. Cada semana recibe la parte de la cuota que corresponde a sus días hábiles: el ancho de cada bloque es su peso. Día ${W.diasTrans} de ${W.habiles} al ${W.corte}.</p>
      ${selector}
      ${calendario(W, cuotaEq, md)}
      <p class="notas" style="margin-top:10px">Meta acumulada al cierre de un día = meta del mes × días hábiles transcurridos ÷ ${W.habiles}. En la semana en curso solo se exige lo que corresponde a los días ya vividos. Déficit = meta acumulada − real acumulado; el del equipo es la suma de los déficits individuales.</p>
    </div>`;

    const aviso = `<div class="tarjeta aviso c12">
      <h3>Aviso de incumplimiento al ${W.corte}</h3>
      <p class="sub">Semana ${W.semActual + 1} de ${W.total} · día hábil ${W.diasTrans} de ${W.habiles}</p>
      ${enDef.length === 0 ? `<p class="notas">Ningún asesor arrastra déficit acumulado a esta fecha.</p>`
        : `<p style="font-size:.86rem;margin:0 0 8px"><b>${enDef.length}</b> de ${W.filas.length} asesores están por debajo de la meta acumulada.</p>
           <div>${enDef.map(v => `<span class="chip ${v.incumpleVol && v.incumpleCli ? "mal" : "med"}">${v.vendedor}: ${v.incumpleVol ? md.fmt(v.deficitVol) : ""}${v.incumpleVol && v.incumpleCli ? " · " : ""}${v.incumpleCli ? f0(v.deficitCli) + " clientes" : ""}</span>`).join("")}</div>`}
      <p class="notas" style="margin-top:12px">Déficit total acumulado: ${W.sinCuota ? "" : `<b>${md.fmt(W.totales.deficitVol)}</b> (cumplimiento ${fp(W.totales.cumplVol)}) y `}<b>${f0(W.totales.deficitCli)} clientes</b> (cobertura ${fp(W.totales.cumplCli)}) en ${W.marca === "TODAS" ? "activación general" : W.marca}.</p>
    </div>`;

    return logica + aviso +
      (W.sinCuota ? avisoCuota(`El déficit de volumen necesita cuotas por asesor en ${md.nombre}. Cárguelas en la estructura comercial del panel administrativo.`)
        : bloque(`Déficit semanal en ${md.nombre}`, `Cada celda: déficit acumulado al cierre de la semana (o al día de corte si está en curso) y, debajo, real contra meta acumulada. Las semanas por venir muestran la meta acumulada que habrá que alcanzar.`, "volAcum", "metaVolAcum", "metaVolSem", "deficitVol", "incumpleVol", "faltaSemVol", md.fmt, W.totales.deficitVol, v => v.cuota > 0)) +
      bloque(`Déficit semanal en cobertura · ${nomMarca(W.marca)}`, `Meta de clientes activados = cartera × target ${W.target}%, repartida por días hábiles igual que la cuota.`, "clientesAcum", "metaCliAcum", "metaCliSem", "deficitCli", "incumpleCli", "faltaSemCli", f0, W.totales.deficitCli, v => v.cartera > 0);
  }
  function pintarSemanal(){
    $("semanal").innerHTML = tablaSemanal();
    $("fDiaSem").addEventListener("change", e => { DIA_SEM = e.target.value; pintarSemanal(); });
  }

  /* ---------- histórico de cierres ---------- */
  let HIST = { cierres: {} }, HIST_INFO = null, CIERRE_SEL = "", MATRIZ = "vol";
  const mesDeIso = k => k.slice(0, 7);
  const nomMes = k => { const [y, m] = k.split("-"); return ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"][+m - 1] + " " + y; };

  function graficoEvol(cierres, med){
    if (cierres.length < 1) return "";
    const W = 900, Hh = 230, pl = 64, pr = 16, pt = 14, pb = 34;
    const real = cierres.map(c => c.totales[med].acum), meta = cierres.map(c => c.totales[med].meta), cuota = cierres[cierres.length-1].totales[med].cuota;
    const max = Math.max(1, ...real, ...meta, cuota || 0) * 1.08;
    const x = i => pl + (cierres.length === 1 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (cierres.length - 1));
    const y = v => pt + (Hh - pt - pb) * (1 - v / max);
    const linea = arr => arr.map((v,i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    const fmt = med === "kg" ? (n => f0(n)) : (n => "$" + f0(n));
    const ticks = [0, .25, .5, .75, 1].map(t => max * t);
    return `<svg viewBox="0 0 ${W} ${Hh}" style="width:100%;height:auto" role="img" aria-label="Evolución del acumulado contra la meta">
      ${ticks.map(t => `<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="#D8DFF2"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="#66708F">${fmt(t)}</text>`).join("")}
      ${cuota ? `<line x1="${pl}" x2="${W-pr}" y1="${y(cuota)}" y2="${y(cuota)}" stroke="#128C5A" stroke-dasharray="4 4"/><text x="${W-pr}" y="${y(cuota)-5}" text-anchor="end" font-size="11" fill="#128C5A">cuota del mes ${fmt(cuota)}</text>` : ""}
      <path d="${linea(meta)}" fill="none" stroke="#E5142B" stroke-width="2.5" stroke-dasharray="7 5"/>
      <path d="${linea(real)}" fill="none" stroke="#0B2A8A" stroke-width="3"/>
      ${cierres.map((c,i) => `<circle cx="${x(i)}" cy="${y(real[i])}" r="${c.iso === CIERRE_SEL ? 6 : 3.5}" fill="${c.totales[med].def > 0 ? "#E5142B" : "#128C5A"}" stroke="#fff" stroke-width="1.5"><title>${c.fecha}: real ${fmt(real[i])} · meta ${fmt(meta[i])}</title></circle>
        <text x="${x(i)}" y="${Hh-12}" text-anchor="middle" font-size="10.5" fill="${c.iso === CIERRE_SEL ? "#0B2A8A" : "#66708F"}" font-weight="${c.iso === CIERRE_SEL ? 800 : 400}">${c.fecha.slice(0,5)}</text>`).join("")}
      <g font-size="11"><rect x="${pl+6}" y="${pt}" width="12" height="3" fill="#0B2A8A"/><text x="${pl+22}" y="${pt+5}" fill="#10193A">Real acumulado</text>
      <rect x="${pl+130}" y="${pt}" width="12" height="3" fill="#E5142B"/><text x="${pl+146}" y="${pt+5}" fill="#10193A">Meta acumulada</text></g>
    </svg>`;
  }

  function vistaHistorial(){
    const claves = Object.keys(HIST.cierres).sort();
    if (!claves.length) return `<div class="tarjeta c12"><div class="vacio">Todavía no hay cierres registrados. Se crean en el panel administrativo cada vez que se carga el reporte: cada día ya terminado queda congelado con su déficit, y al publicar se guarda en <code>historial.json</code>.</div></div>`;
    if (!CIERRE_SEL || !HIST.cierres[CIERRE_SEL]) CIERRE_SEL = claves[claves.length - 1];
    const C = HIST.cierres[CIERRE_SEL], mes = mesDeIso(CIERRE_SEL);
    const meses = Array.from(new Set(claves.map(mesDeIso))).sort().reverse();
    const delMesTodos = claves.filter(k => mesDeIso(k) === mes).map(k => HIST.cierres[k]);
    const delMes = delMesTodos.filter(c => VJ.vigente(c));   /* gráfica y matriz solo con cierres vigentes */
    const med = $("fVol").value === "kg" ? "kg" : "us", md = VJ.medidaDe(med === "kg" ? "kg" : "usd");
    const T = C.totales, tv = T[med];
    const idx = delMesTodos.findIndex(c => c.iso === CIERRE_SEL), prev = delMesTodos[idx - 1], next = delMesTodos[idx + 1];
    const delta = (a, b, fmt) => b == null ? "" : `<small style="display:block;color:${a > b ? "var(--rojo)" : "var(--verde)"};font-size:.7rem">${a > b ? "▲" : a < b ? "▼" : "="} ${fmt(Math.abs(a - b))} vs día anterior</small>`;
    const conCuota = C.vendedores.filter(v => v[med].cuota > 0);
    const conCartera = C.vendedores.filter(v => v.metaCli > 0);

    const controles = `<div class="tarjeta c12 no-print">
      <div class="buscador" style="margin:0">
        <label for="hMes" style="font-size:.78rem;font-weight:700;color:var(--gris)">Mes</label>
        <select id="hMes">${meses.map(m => `<option value="${m}" ${m === mes ? "selected" : ""}>${nomMes(m)}</option>`).join("")}</select>
        <label for="hDia" style="font-size:.78rem;font-weight:700;color:var(--gris)">Cierre del día</label>
        <select id="hDia">${delMesTodos.slice().reverse().map(c => `<option value="${c.iso}" ${c.iso === CIERRE_SEL ? "selected" : ""}>${c.fecha} · día hábil ${c.diaHabil} · S${c.semana}${!VJ.vigente(c) ? " · ANULADO" : c.totales.enDeficit ? " · " + c.totales.enDeficit + " en déficit" : ""}</option>`).join("")}</select>
        <button class="btn linea" id="hPrev" ${prev ? "" : "disabled"}>Día anterior</button>
        <button class="btn linea" id="hNext" ${next ? "" : "disabled"}>Día siguiente</button>
        <button class="btn azul" id="hLink">Copiar enlace a este cierre</button>
        <button class="btn linea" id="hCsv">Descargar CSV del cierre</button>
        <span id="hMsg" style="font-size:.76rem;color:var(--gris)">${claves.length} cierres guardados · ${HIST_INFO && HIST_INFO.remoto ? "historial del repositorio" : "historial de este navegador"}</span>
      </div></div>`;

    const kpis = `
      <div class="tarjeta kpi c3"><p class="rot">Cierre del ${C.fecha}</p><p class="val">Día ${C.diaHabil}<small>de ${C.habiles}</small></p>
        <div class="barrita"><span class="med" style="width:${100*C.diaHabil/C.habiles}%"></span></div>
        <p class="pie">Semana <b>${C.semana} de ${C.semanas}</b> (${C.semanaDesde}–${C.semanaHasta}, ${C.diasSemana} días hábiles)<br>Registrado el ${new Date(C.registrado).toLocaleString("es-VE")}</p></div>
      <div class="tarjeta kpi rojo c3"><p class="rot">Déficit de ${md.nombre} acumulado</p><p class="val" style="font-size:1.6rem">${tv.cuota ? md.fmt(tv.def) : "—"}</p>
        <p class="pie">${tv.cuota ? `Real <b>${md.fmt(tv.acum)}</b> de una meta acumulada de <b>${md.fmt(tv.meta)}</b> · ${fp(tv.meta ? 100*tv.acum/tv.meta : null)}${delta(tv.def, prev && prev.totales[med].def, md.fmt)}` : "Ese día no había cuotas cargadas en " + md.nombre}</p></div>
      <div class="tarjeta kpi ambar c3"><p class="rot">Déficit de cobertura acumulado</p><p class="val">${f0(T.cli.def)}<small>clientes</small></p>
        <p class="pie"><b>${f0(T.cli.acum)}</b> activados de una meta acumulada de <b>${f0(T.cli.meta)}</b>${delta(T.cli.def, prev && prev.totales.cli.def, f0)}</p></div>
      <div class="tarjeta kpi verde c3"><p class="rot">Asesores en déficit</p><p class="val">${f0(T.enDeficit)}<small>de ${f0(T.asesores)}</small></p>
        <p class="pie">Debajo de la meta acumulada en volumen o en cobertura${delta(T.enDeficit, prev && prev.totales.enDeficit, f0)}</p></div>`;

    const evol = `<div class="tarjeta c12">
      <h3>Evolución diaria de ${nomMes(mes)} · equipo comercial</h3>
      <p class="sub">Cada punto es un cierre registrado: real acumulado contra meta acumulada en ${md.nombre}. Rojo: cerró ese día en déficit; verde: al día.</p>
      ${delMes.some(c => c.totales[med].cuota) ? graficoEvol(delMes, med) : `<div class="vacio">No hay cuotas de ${md.nombre} en los cierres de este mes.</div>`}
    </div>`;

    const tabla = `<div class="tarjeta c12">
      <h3>Déficit por asesor al cierre del ${C.fecha}</h3>
      <p class="sub">Foto congelada de ese día · meta acumulada = meta del mes × ${C.diaHabil} ÷ ${C.habiles} días hábiles · la última columna es lo que faltaba para cerrar sana la semana ${C.semana}</p>
      <div class="tw"><table>
        <thead><tr><th>Vendedor</th><th>Supervisor</th><th>Venta del día</th><th>Cuota mes</th><th>Real acum.</th><th>Meta acum.</th><th>Déficit</th><th>Cumpl.</th><th>Clientes</th><th>Meta clientes</th><th>Déficit clientes</th><th>Faltaba para la semana</th></tr></thead>
        <tbody>${C.vendedores.map(v => { const x = v[med]; const c = x.meta ? 100 * x.acum / x.meta : null; return `<tr>
          <td><b>${v.v}</b></td><td>${v.sup}</td><td>${fu(v.usDia)}</td>
          <td>${x.cuota ? md.fmt(x.cuota) : "—"}</td><td>${md.fmt(x.acum)}</td><td>${x.cuota ? md.fmt(x.meta) : "—"}</td>
          <td>${x.cuota ? `<span class="pill ${x.def > 0 ? "mal" : "ok"}">${x.def > 0 ? md.fmt(x.def) : "al día"}</span>` : "—"}</td>
          <td>${c == null ? "—" : `<span class="pill ${sem(c)}">${fp(c)}</span>`}</td>
          <td>${f0(v.cli)}</td><td>${v.metaCli ? f1(v.metaCliAcum) : "—"}</td>
          <td>${v.metaCli ? `<span class="pill ${v.defCli > 0 ? "mal" : "ok"}">${v.defCli > 0 ? f0(v.defCli) : "al día"}</span>` : "—"}</td>
          <td>${x.cuota ? md.fmt(x.falta) : ""}${x.cuota && v.metaCli ? " · " : ""}${v.metaCli ? f0(v.faltaSemCli) + " cl." : ""}</td></tr>`; }).join("")}</tbody>
        <tfoot><tr><td>Total</td><td>—</td><td>${fu(C.vendedores.reduce((a,v)=>a+v.usDia,0))}</td><td>${tv.cuota ? md.fmt(tv.cuota) : "—"}</td><td>${md.fmt(tv.acum)}</td><td>${tv.cuota ? md.fmt(tv.meta) : "—"}</td><td>${tv.cuota ? md.fmt(tv.def) : "—"}</td><td>${tv.meta ? fp(100*tv.acum/tv.meta) : "—"}</td><td>${f0(T.cli.acum)}</td><td>${f1(T.cli.meta)}</td><td>${f0(T.cli.def)}</td><td>—</td></tr></tfoot>
      </table></div></div>`;

    const filasM = conCuota.length || conCartera.length ? (MATRIZ === "vol" ? conCuota : conCartera) : [];
    const matriz = `<div class="tarjeta c12">
      <h3>Matriz de déficit diario · ${nomMes(mes)}</h3>
      <p class="sub">Déficit acumulado de cada asesor al cierre de cada día registrado. Pulse una fecha para abrir ese cierre.</p>
      <div class="buscador no-print"><label style="font-size:.8rem;font-weight:700;color:var(--gris)">Mostrar</label>
        <select id="hMatriz"><option value="vol" ${MATRIZ === "vol" ? "selected" : ""}>Déficit en ${md.nombre}</option><option value="cli" ${MATRIZ === "cli" ? "selected" : ""}>Déficit de clientes</option></select></div>
      ${filasM.length ? `<div class="tw"><table>
        <thead><tr><th>Vendedor</th>${delMes.map(c => `<th><a href="#cierre=${c.iso}" data-ir="${c.iso}" style="color:#fff;${c.iso === CIERRE_SEL ? "text-decoration:underline" : "text-decoration:none"}">${c.fecha.slice(0,5)}</a><br><small style="font-weight:600">S${c.semana}</small></th>`).join("")}</tr></thead>
        <tbody>${filasM.map(v => `<tr><td><b>${v.v}</b></td>${delMes.map(c => {
          const w = c.vendedores.find(z => z.v === v.v);
          if (!w) return "<td class='sem fuera'>—</td>";
          const d = MATRIZ === "vol" ? w[med].def : w.defCli;
          return `<td class="sem" style="${c.iso === CIERRE_SEL ? "background:var(--azul-claro)" : ""}"><span class="pill ${d > 0 ? "mal" : "ok"}">${d > 0 ? (MATRIZ === "vol" ? md.fmtCorto(d) : f0(d)) : "✓"}</span></td>`; }).join("")}</tr>`).join("")}</tbody>
      </table></div>` : `<div class="vacio">Sin asesores con ${MATRIZ === "vol" ? "cuota de " + md.nombre : "cartera"} en este mes.</div>`}
    </div>`;

    const marcas = `<div class="tarjeta c12">
      <h3>Marcas al cierre del ${C.fecha}</h3>
      <p class="sub">Venta acumulada contra la cuota prorrateada al día ${C.diaHabil} de ${C.habiles}</p>
      <div class="tw"><table><thead><tr><th>Marca</th><th>Venta del día</th><th>Venta acum.</th><th>Meta acum. US$</th><th>Cumpl. US$</th><th>Kilos acum.</th><th>Meta acum. kg</th><th>Clientes activados</th><th>Activación</th></tr></thead>
      <tbody>${C.marcas.map(m => `<tr class="${m.foco ? "foco" : ""}"><td><b>${VJ.nombreMarca(m.m, CFG)}</b>${m.foco ? '<span class="etq">foco</span>' : ""}</td>
        <td>${fu(m.usDia)}</td><td>${fu(m.us)}</td><td>${m.cuUs ? fu(m.metaUs) : "—"}</td><td>${m.cuUs ? `<span class="pill ${sem(100*m.us/m.metaUs)}">${fp(100*m.us/m.metaUs)}</span>` : "—"}</td>
        <td>${f1(m.kg)}</td><td>${m.cuKg ? f1(m.metaKg) : "—"}</td><td>${f0(m.act)}</td><td>${fp(C.universo ? 100*m.act/C.universo : null)}</td></tr>`).join("")}</tbody></table></div></div>`;

    const aviso = VJ.vigente(C) ? "" : `<div class="tarjeta aviso c12"><h3>Cierre del ${C.fecha} anulado</h3>
      <p class="sub">Marcado como erróneo el ${new Date(C.anulado.ts).toLocaleString("es-VE")}${C.anulado.motivo ? " · motivo: " + C.anulado.motivo : ""}. Se muestra solo como referencia: no cuenta en la evolución ni en la matriz.</p></div>`;
    return controles + aviso + kpis + evol + tabla + matriz + marcas;
  }

  function csvCierre(){
    const C = HIST.cierres[CIERRE_SEL]; if (!C) return;
    const n = v => v == null ? "" : (+v).toFixed(2).replace(".", ",");
    const filas = C.vendedores.map(v => [C.fecha, C.diaHabil, C.semana, v.v, v.sup, n(v.usDia), n(v.us.cuota), n(v.us.acum), n(v.us.meta), n(v.us.def), n(v.kg.cuota), n(v.kg.acum), n(v.kg.meta), n(v.kg.def), v.cli, n(v.metaCliAcum), v.defCli]);
    bajar(`cierre_${C.iso}.csv`, csv(filas, ["Fecha","Dia habil","Semana","Vendedor","Supervisor","Venta del dia","Cuota US$","Real US$","Meta acum US$","Deficit US$","Cuota kg","Real kg","Meta acum kg","Deficit kg","Clientes","Meta acum clientes","Deficit clientes"]));
  }

  function irACierre(iso){ CIERRE_SEL = iso; history.replaceState(null, "", "#cierre=" + iso); pintarHistorial(); }
  function pintarHistorial(){
    $("historial").innerHTML = vistaHistorial();
    if (!$("hMes")) return;
    $("hMes").addEventListener("change", e => { const k = Object.keys(HIST.cierres).sort().filter(x => mesDeIso(x) === e.target.value); irACierre(k[k.length - 1]); });
    $("hDia").addEventListener("change", e => irACierre(e.target.value));
    const ks = Object.keys(HIST.cierres).sort().filter(x => mesDeIso(x) === mesDeIso(CIERRE_SEL)), i = ks.indexOf(CIERRE_SEL);
    $("hPrev").addEventListener("click", () => ks[i-1] && irACierre(ks[i-1]));
    $("hNext").addEventListener("click", () => ks[i+1] && irACierre(ks[i+1]));
    $("hMatriz").addEventListener("change", e => { MATRIZ = e.target.value; pintarHistorial(); });
    $("hCsv").addEventListener("click", csvCierre);
    $("hLink").addEventListener("click", async () => {
      const url = location.href.split("#")[0] + "#cierre=" + CIERRE_SEL;
      try { await navigator.clipboard.writeText(url); $("hMsg").textContent = "Enlace copiado: " + url; } catch (e) { $("hMsg").textContent = url; }
    });
    document.querySelectorAll("[data-ir]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); irACierre(a.dataset.ir); }));
  }

  /* ---------- principal ---------- */
  function pintar(){
    const M = VJ.computeVend(DS, CFG, opt()), md = M.medida;
    actualizarLogoMarca(M.marca);
    const orden = $("fOrden").value;
    const sups = M.supervisores.slice().sort((a,b)=> orden === "faltan" ? b.faltan - a.faltan : orden === "cartera" ? b.cartera - a.cartera : (b.pct||0)-(a.pct||0));
    const mejor = M.supervisores[0];
    const peor = M.supervisores.slice().sort((a,b)=> b.faltan - a.faltan)[0];
    $("resumen").innerHTML = `
      <div class="tarjeta kpi c3"><p class="rot">${inverso() ? "Brecha pendiente del equipo" : "Activación del equipo comercial"}</p><p class="val">${fp(val(M.total))}</p>
        <div class="barrita"><span class="${sem(M.total.pct)}" style="width:${Math.min(100, val(M.total)||0)}%"></span></div>
        <p class="pie"><b>${f0(M.total.activados)}</b> activados de una meta de <b>${f0(M.total.meta)}</b><br>Base: ${f0(M.total.cartera)} clientes${M.total.sinCartera ? " · " + f0(M.total.sinCartera) + " fuera de cartera" : ""} · ${md.fmt(M.total.vol)}</p></div>
      <div class="tarjeta kpi rojo c3"><p class="rot">Clientes por activar</p><p class="val">${f0(M.total.faltan)}</p>
        <p class="pie">Meta de ${M.marca === "TODAS" ? "activación general" : M.marca} · target <b>${M.target}%</b><br>Ritmo necesario: <b>${f1(M.total.porDia)}</b> activaciones por día hábil</p></div>
      <div class="tarjeta kpi verde c3"><p class="rot">Mejor supervisor</p><p class="val" style="font-size:1.15rem">${mejor ? mejor.supervisor : "—"}</p>
        <p class="pie">${mejor ? `<b>${fp(mejor.pct)}</b> de cumplimiento · ${f0(mejor.activados)} de ${f0(mejor.meta)}` : ""}</p></div>
      <div class="tarjeta kpi ambar c3"><p class="rot">Mayor brecha por cubrir</p><p class="val" style="font-size:1.15rem">${peor ? peor.supervisor : "—"}</p>
        <p class="pie">${peor ? `Faltan <b>${f0(peor.faltan)}</b> clientes · ${fp(peor.pct)} de cumplimiento` : ""}</p></div>`;
    $("alertas").innerHTML = alertas(M);
    $("marcas").innerHTML = tablaMarcas(M);
    $("equipos").innerHTML = sups.map(S => tarjetaSup(S, md)).join("");
    $("tabla").innerHTML = tablaVend(M);
    pintarClientes(); pintarRolling(); pintarSemanal(); pintarHistorial();
    $("subtit").textContent = `· Período ${M.meta.desde} al ${M.meta.hasta} · ${M.supervisores.length} supervisores · ${M.vendedores.length} vendedores · ${DS.marcas.length} marcas`;
    $("selloMes").textContent = "Performance " + M.meta.mes;
    $("selloAct").textContent = "Actualizado " + (DS.publicado || DS.generado || "—");
    $("pieArchivo").textContent = `Fuente: ${M.meta.archivo} · procesado el ${DS.generado}${DS.publicado ? " · publicado el " + DS.publicado : ""} · corte ${M.dias.corte} · página abierta el ${new Date().toLocaleString("es-VE")}`;
  }

  async function cargar(){
    const r = await VJ.cargarDataset(DATASET_BASE);
    CFG = VJ.migrarAlias(JSON.parse(JSON.stringify(await VJ.cargarConfig(r.ds)))); DS = VJ.conAlias(r.ds, CFG);
    HIST_INFO = await VJ.cargarHistorial(); HIST = HIST_INFO.h;
    const m = location.hash.match(/cierre=(\d{4}-\d{2}-\d{2})/);
    if (m && !CIERRE_SEL) { CIERRE_SEL = m[1]; setTimeout(() => verPestana("historial"), 0); }
    $("estado").innerHTML = `Origen: <b>${r.origen}</b>${r.error && r.origen !== "repositorio" ? " · no se pudo leer dataset.json (" + r.error + ")" : ""}`;
    $("selloArchivo").textContent = VJ.sello(DS, r.origen);
    const P = VJ.params(DS, CFG);
    const previa = $("fMarca").value;
    $("fMarca").innerHTML = `<option value="TODAS">Todas las marcas</option>` +
      P.ranking.map(m => `<option value="${m}">${m} · target ${P.marca(m).target}%${P.foco.indexOf(m) > -1 ? " · foco" : ""}</option>`).join("");
    $("fMarca").value = previa && (previa === "TODAS" || P.ranking.indexOf(previa) > -1) ? previa : "TODAS";
    if (!$("fVol").dataset.tocado) $("fVol").value = P.medida;
    const sel = $("fVend").value, vends = DS.vends.slice().sort();
    $("fVend").innerHTML = '<option>TODOS</option>' + vends.map(v=>`<option>${v}</option>`).join("");
    if (sel && vends.indexOf(sel) > -1) $("fVend").value = sel;
    pintar();
  }

  ["fMarca","fOrden","fVend","fMedida"].forEach(id => $(id).addEventListener("change", pintar));
  $("fVol").addEventListener("change", () => { $("fVol").dataset.tocado = "1"; pintar(); });
  $("bPrint").addEventListener("click", () => window.print());
  $("bPanel").addEventListener("click", () => window.location.href = "index.html");
  $("bResumen").addEventListener("click", () => window.location.href = "reporte.html");
  function verPestana(v){
    document.querySelectorAll(".pest").forEach(x => x.classList.toggle("activa", x.dataset.vista === v));
    ["alertas","marcas","equipos","tabla"].forEach(id => $(id).style.display = v === "equipos" ? "grid" : "none");
    ["clientes","rolling","semanal","historial"].forEach(id => $(id).style.display = v === id ? "grid" : "none");
  }
  document.querySelectorAll(".pest").forEach(b => b.addEventListener("click", () => verPestana(b.dataset.vista)));
  window.addEventListener("hashchange", () => {
    const m = location.hash.match(/cierre=(\d{4}-\d{2}-\d{2})/);
    if (m && HIST.cierres[m[1]] && m[1] !== CIERRE_SEL) { CIERRE_SEL = m[1]; pintarHistorial(); verPestana("historial"); }
  });
  $("bRecargar").addEventListener("click", async () => {
    const b = $("bRecargar"); b.disabled = true; b.textContent = "Recargando…";
    await cargar();
    b.textContent = "Recargar datos"; b.disabled = false;
  });
  cargar();
})();
</script>
</body>
</html>
